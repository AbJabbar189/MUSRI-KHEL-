<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D472B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#072718;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" rx="15" fill="#ffffff" stroke="#D4AF37" stroke-width="4"/>
  <!-- Header Bar -->
  <rect width="600" height="80" rx="10" fill="url(#grad1)"/>
  <text x="300" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#D4AF37" text-anchor="middle">مصری خیل قومی اتحاد فاؤنڈیشن</text>
  <text x="300" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">سرکاری رسید برائے انٹری ممبرشپ فیس (Official Fee Receipt)</text>
  
  <!-- Watermark Stamp -->
  <circle cx="480" cy="240" r="65" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="6,4" opacity="0.35"/>
  <text x="480" y="235" font-family="Arial" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle" transform="rotate(-15 480 235)" opacity="0.5">VERIFIED &amp; PAID</text>
  <text x="480" y="255" font-family="Arial" font-size="12" fill="#2e7d32" text-anchor="middle" transform="rotate(-15 480 255)" opacity="0.5">PKR 300</text>

  <!-- Content Details -->
  <!-- Line 1: Member Name & ID -->
  <text x="40" y="125" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#555">نام رکن (Member Name):</text>
  <text x="250" y="125" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#0D472B">عمران خان مصری خیل (Imran Khan)</text>
  
  <!-- Line 2: CNIC -->
  <text x="40" y="160" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#555">شناختی کارڈ (CNIC):</text>
  <text x="250" y="160" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#111">15201-1234567-1</text>
  
  <!-- Line 3: Membership ID -->
  <text x="40" y="195" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#555">ممبرشپ نمبر (ID):</text>
  <text x="250" y="195" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#D4AF37">MKQI-2026-0001</text>

  <!-- Line 4: Amount -->
  <text x="40" y="230" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#555">فیس رقم (Amount Paid):</text>
  <text x="250" y="230" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">روپے 300 (PKR 300.00) - Paid</text>

  <!-- Line 5: Payment Channel & TRX -->
  <text x="40" y="265" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#555">طریقہ و ٹرانزیکشن (Method):</text>
  <text x="250" y="265" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#111">EasyPaisa / TRX: EP-982341890</text>

  <!-- Line 6: Date -->
  <text x="40" y="300" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#555">تاریخ و وقت (Date &amp; Time):</text>
  <text x="250" y="300" font-family="'Segoe UI', sans-serif" font-size="14" fill="#333">15 اکتوبر 2026 • شام 05:22 بجے</text>

  <!-- Divider -->
  <line x1="40" y1="330" x2="560" y2="330" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Footer Notice -->
  <text x="300" y="360" font-family="'Segoe UI', sans-serif" font-size="12" fill="#718096" text-anchor="middle">یہ رسید مصری خیل قومی اتحاد فاؤنڈیشن کے تصدیق شدہ مرکزی مالیاتی ڈیٹا بیس سے جاری شدہ ہے۔</text>
  <text x="300" y="380" font-family="'Segoe UI', sans-serif" font-size="11" fill="#A0AEC0" text-anchor="middle">Secured with Cryptographic Token &amp; Audit Trail • misrikhel.org</text>
</svg>
